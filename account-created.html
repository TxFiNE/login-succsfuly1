<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اکانت ساخته شد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0f;
    --o1:#ff9a0e;
    --o2:#ff5a0c;
    --text:#f4f1ee;
    --muted:#a9a49f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn',Tahoma,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* پس‌زمینه درخشان */
  .glow{
    position:absolute;width:70vmin;height:70vmin;border-radius:50%;
    background:radial-gradient(circle,rgba(255,110,10,.35),transparent 65%);
    filter:blur(40px);opacity:0;
    animation:glowIn 2.5s .6s ease forwards, glowPulse 4s 3s ease-in-out infinite;
    top:50%;left:50%;transform:translate(-50%,-62%);
    pointer-events:none;
  }
  @keyframes glowIn{to{opacity:1}}
  @keyframes glowPulse{50%{opacity:.55;transform:translate(-50%,-62%) scale(1.15)}}

  /* ذرات */
  .particle{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:linear-gradient(var(--o1),var(--o2));
    opacity:0;pointer-events:none;
    animation:float linear infinite;
  }
  @keyframes float{
    0%{opacity:0;transform:translateY(0) scale(.5)}
    20%{opacity:.8}
    100%{opacity:0;transform:translateY(-120px) scale(1.2)}
  }

  .stage{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding:24px;text-align:center;width:100%;max-width:560px;
  }

  /* لوگو */
  .logo{
    width:min(52vw,230px);height:auto;
    animation:logoMove 1s 3.4s cubic-bezier(.7,0,.2,1) forwards;
    filter:drop-shadow(0 0 22px rgba(255,110,10,.45));
  }
  .logo .body{
    transform-box:fill-box;transform-origin:50% 50%;
    opacity:0;transform:scale(.3) rotate(-12deg);
    animation:bodyIn .9s .2s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  .logo .top{
    transform-box:fill-box;transform-origin:0% 100%;
    opacity:0;transform:translateY(-90px) rotate(-38deg);
    animation:topIn .7s .7s cubic-bezier(.2,1.2,.4,1) forwards,
              clap .55s 1.7s ease-in-out forwards;
  }
  .logo .play{
    transform-box:fill-box;transform-origin:50% 50%;
    opacity:0;transform:scale(0);
    animation:playIn .6s 1.25s cubic-bezier(.2,1.6,.4,1) forwards,
              playPulse 1.4s 2.4s ease-in-out 1;
  }
  @keyframes bodyIn{to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes topIn{to{opacity:1;transform:translateY(0) rotate(-14deg)}}
  @keyframes clap{
    0%{transform:translateY(0) rotate(-14deg)}
    45%{transform:translateY(0) rotate(2deg)}
    100%{transform:translateY(0) rotate(0)}
  }
  @keyframes playIn{to{opacity:1;transform:scale(1)}}
  @keyframes playPulse{50%{transform:scale(1.18)}}
  @keyframes logoMove{
    to{transform:translateY(-6px) scale(.62);margin-bottom:-40px}
  }

  /* موج برخورد */
  .ring{
    position:absolute;top:min(26vw,115px);left:50%;
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--o1);opacity:0;
    transform:translate(-50%,-50%) scale(1);
    animation:ring 1s 1.95s ease-out forwards;
  }
  @keyframes ring{
    0%{opacity:.9;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(18)}
  }

  /* متن‌ها */
  .title{
    margin-top:26px;
    font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.5;
    background:linear-gradient(90deg,var(--o1),var(--o2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:flex;flex-wrap:wrap;justify-content:center;gap:.3em;
  }
  .title span{
    display:inline-block;opacity:0;
    transform:translateY(40px) rotateX(-90deg) scale(.8);
    filter:blur(10px);
    animation:wordIn .8s cubic-bezier(.2,1.2,.4,1) forwards;
  }
  .title span:nth-child(1){animation-delay:4.2s}
  .title span:nth-child(2){animation-delay:4.4s}
  .title span:nth-child(3){animation-delay:4.6s}
  .title span:nth-child(4){animation-delay:4.8s}
  @keyframes wordIn{
    to{opacity:1;transform:none;filter:blur(0)}
  }

  .check{
    margin-top:14px;width:54px;height:54px;opacity:0;
    animation:fadeUp .6s 5.3s ease forwards;
  }
  .check circle{
    fill:none;stroke:var(--o1);stroke-width:3;
    stroke-dasharray:160;stroke-dashoffset:160;
    animation:draw .8s 5.4s ease forwards;
  }
  .check path{
    fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:40;stroke-dashoffset:40;
    animation:draw .5s 6s ease forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}

  .desc{
    margin-top:18px;font-size:clamp(15px,4vw,19px);line-height:2;color:var(--muted);
    opacity:0;animation:fadeUp .9s 6.3s ease forwards;
  }
  .desc b{color:var(--text);font-weight:600}
  .desc .hl{
    color:var(--o1);font-weight:800;
    border-bottom:2px solid var(--o2);padding-bottom:1px;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
  }

  .credit{
    position:absolute;bottom:22px;left:0;right:0;text-align:center;z-index:2;
    font-size:14px;color:var(--muted);letter-spacing:.5px;
    opacity:0;animation:fadeUp 1s 7.2s ease forwards;
  }
  .credit strong{
    font-family:Arial,sans-serif;letter-spacing:2px;
    background:linear-gradient(90deg,var(--o1),var(--o2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .replay{
    position:absolute;top:18px;right:18px;z-index:3;
    background:rgba(255,255,255,.06);color:var(--muted);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;
    padding:6px 14px;font-family:inherit;font-size:13px;cursor:pointer;
    opacity:0;animation:fadeUp .6s 8s ease forwards;
    transition:.2s;
  }
  .replay:hover{color:#fff;border-color:var(--o1)}
</style>
</head>
<body>

<div class="glow"></div>
<div id="particles"></div>
<button class="replay" onclick="location.reload()">↻ پخش دوباره</button>

<main class="stage">
  <div class="ring"></div>

  <svg class="logo" viewBox="380 345 495 515" xmlns="http://www.w3.org/2000/svg" aria-label="لوگو">
    <defs>
      <linearGradient id="g" x1="0.2" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="#ff9a0e"/>
        <stop offset="1" stop-color="#ff5a0c"/>
      </linearGradient>
      <mask id="cut">
        <rect x="380" y="530" width="495" height="330" fill="#fff"/>
        <path d="M541 640Q541 615 570 620L700 690Q720 705 704 726L568 797Q541 805 541 780Z" fill="#000"/>
      </mask>
    </defs>

    <path class="top" fill="url(#g)"
      d="M430 455L780 358Q815 352 832 390L850 455Q851 459 846 460Q640 497 398 546Q392 547 391 541L389 510Q389 470 430 455Z"/>

    <g class="body">
      <path fill="url(#g)" mask="url(#cut)"
        d="M430 566L832 540Q862 540 864 572L863 782Q863 848 795 848L460 848Q390 848 390 780L390 596Q390 570 430 566Z"/>
    </g>
    <!-- مثلث پلی (برای انیمیشن جداگانه، هم‌رنگ پس‌زمینه) -->
    <path class="play" fill="#0c0c0f"
      d="M541 640Q541 615 570 620L700 690Q720 705 704 726L568 797Q541 805 541 780Z"/>
  </svg>

  <h1 class="title">
    <span>اکانت</span><span>شما</span><span>با</span><span>موفقیت ساخته شد!</span>
  </h1>

  <svg class="check" viewBox="0 0 54 54">
    <circle cx="27" cy="27" r="25"/>
    <path d="M16 28l8 8 15-17"/>
  </svg>

  <p class="desc">
    برای ورود، وارد بخش <span class="hl">ورود</span> شوید<br>
    و <b>ایمیل</b> و <b>رمز عبور</b> خود را وارد کنید.
  </p>
</main>

<div class="credit">سازنده: <strong>TxFiNE</strong></div>

<script>
  // ذرات شناور
  const box = document.getElementById('particles');
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('i');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = (50 + Math.random() * 50) + 'vh';
    p.style.width = p.style.height = (3 + Math.random() * 5) + 'px';
    p.style.animationDuration = (4 + Math.random() * 5) + 's';
    p.style.animationDelay = (1 + Math.random() * 6) + 's';
    box.appendChild(p);
  }
</script>
</body>
</html>
